<!DOCTYPE html>
<html>

<head>
  <title>PDF Watermark Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1>PDF Watermark Manager</h1>

  <div class="drop-zone" id="dropZone">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="12" y1="18" x2="12" y2="12"></line>
      <line x1="9" y1="15" x2="15" y2="15"></line>
    </svg>
    <p>Drag & Drop PDF or Image<br>or click to select</p>
    <input type="file" id="fileInput" accept=".pdf, .png, .jpg, .jpeg" style="display: none;" multiple>
  </div>

  <div class="controls">
    <label>Watermark Settings</label>
    <input type="text" id="watermarkText" placeholder="Custom Text (e.g. My Brand)">

    <label>Or Upload Logo (Transparent PNG)</label>
    <input type="file" id="logoInput" accept="image/png">

    <button id="processBtn" disabled>Process PDF</button>
  </div>

  <div class="progress-container" id="progressContainer">
    <div class="status-text">
      <span id="statusMessage">Processing...</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <script src="lib/jspdf.umd.min.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>

</html>
